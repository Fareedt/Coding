<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My superhero card</title>
</head>
<body>
    <style>
body{
background-color: darkblue;
color: white;
font-family: arial,sans-serif;
}


.heroname{
    font-size: 60px;
    font-weight: bold;
    color: yellow;
    text-shadow: 3px 3px;
}

.tagline{
    font-size: italic;
    color: lightblue;
    text-transform: capitalize;
}

.label{
    text-transform: uppercase;
    text-decoration: underline;
    color: coral;
}

.power{
    font-weight: bold;
    color: lightgreen;
}

.weakness{
    text-decoration: line-through;
    color: gray;
}

.badge{
    font-size: 28px;
    font-weight: bold;
    color: gold;
    transform: rotate(15deg);
}

.madeby{
    columns: coral;
    font-size: italic;
}
</style>

<h1 class="heroname">Captain cool</h1>
<p class="tagline">The most powerful hero in metropolis</p>


<h2 class="label">super powers</h2>
<p class="power">Can move at lightspeed</p>
<p class="power">   Can lift a building</p>

<h2 class="label">weaknesses</h2>
<p class="weakness">Homework</p>
<p class="weakness">Nasty food</p>

<p class="badge">Top Hero</p>

<p class="made-by">Created by Fareed</p>

</body>
</html>
