<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My animal fact file</title>
</head>
<style>
body{
    background-color: darkgreen;
    font-family: Arial, sans-serif;
}

.fact-file{
    background-color:light yellow;
    color: darkslategray;
    width: 260px;
    padding: 25px;
    border: 4px solid forestgreen;
    margin: 30px;
}

.animal-name{
    color: forestgreen;
    font-size: 22px;
}

.cool-fact{
    color: darkorange;
    font-style: italic;
}

.detail{
    color: darkslategrey;
}

</style>
<body>
    <div class="fact-file">
<h2 class="animal-name">Snow leopard</h2>
<p class="detail">Type: Bigcat</p>
<p class="detail">Lives in:Mountain ranges of central asia</p>
<p class="detail">Diets: Deer, Goats and Wild sheep</p>
<p class="cool-fact">cool fact:can leap up to 15m in one jump</p>
 </div>

</body>
</html>
